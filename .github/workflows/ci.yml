name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Write is only exercised by the baseline auto-push on main;
    # fork PRs receive a read-only token regardless.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: paper §7.2 measurements and the bench baselines are
          # taken on this version; unpinned drift changes numbers silently.
          bun-version: 1.3.14
      # Frozen means frozen: a mismatched lockfile is an error, not a
      # silent regeneration.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # Perf visibility (Q1): raw numbers recorded as an artifact per
      # commit; the gate below turns >20% regressions into failures.
      - name: Benchmark
        run: bun run bench --json=bench.json | tee bench-output.txt
      # Perf gate (Q1): fail the PR when median per-solve time regresses
      # more than 20% against the main-branch baseline (auto-pushed to
      # gh-pages by the run below on main pushes).
      - name: Perf gate (20% regression threshold)
        uses: rhysd/action-benchmark@v1
        with:
          tool: "customSmallerIsBetter"
          output-file-path: bench.json
          alert-threshold: "120%"
          fail-on-alert: true
          comment-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Main pushes update the baseline; PRs compare against it.
          auto-push: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload bench artifact
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: bench-output.txt
