name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: paper §7.2 measurements and the bench baselines are
          # taken on this version; unpinned drift changes numbers silently.
          bun-version: 1.3.14
      # Frozen means frozen: a mismatched lockfile is an error, not a
      # silent regeneration.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # Perf visibility (Q1): raw numbers recorded as an artifact per
      # commit; the gate below turns >20% regressions into failures.
      - name: Benchmark
        run: bun run bench --json=bench.json | tee bench-output.txt
      # Perf gate (Q1): fail the PR when median per-solve time regresses
      # more than 20% against the main-branch baseline (maintained on
      # gh-pages by the bench-baseline job on main pushes). Read-only.
      - name: Perf gate (20% regression threshold)
        run: bun run scripts/perf-gate.ts --check
      - name: Upload bench artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench-output.txt

  # Main pushes store the new perf baseline (needs contents: write,
  # so it lives in its own main-only job; PR runs stay read-only).
  bench-baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the test job.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run bench --json=bench.json > /dev/null
      - name: Store perf baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/perf-gate.ts --update
