name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: paper §7.2 measurements and the bench baselines are
          # taken on this version; unpinned drift changes numbers silently.
          bun-version: 1.3.14
      # Frozen means frozen: a mismatched lockfile is an error, not a
      # silent regeneration.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # Perf visibility (Q1): no thresholds yet — numbers are recorded
      # as an artifact per commit so regressions are diffable after the
      # fact instead of invisible.
      - name: Benchmark
        run: bun run bench | tee bench-output.txt
      - name: Upload bench artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench-output.txt
