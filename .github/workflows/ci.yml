name: CI

on:
  push:
    branches: [main, uat]
  pull_request:

permissions:
  contents: read

concurrency:
  # Rapid pushes must not stack duplicate bench jobs (or race the
  # gh-pages baseline PUT into a 409); PRs cancel superseded runs, main
  # queues so the baseline history stays gap-free.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: paper §7.2 measurements and the bench baselines are
          # taken on this version; unpinned drift changes numbers silently.
          bun-version: 1.3.14
      # Frozen means frozen: a mismatched lockfile is an error, not a
      # silent regeneration.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # Perf visibility (Q1): raw numbers recorded as an artifact per
      # commit; the gate below turns >20% regressions into failures.
      # pipefail: a bench crash must fail the step, not hide behind
      # tee's exit 0 and surface later as a truncated bench.json.
      - name: Benchmark
        run: |
          set -o pipefail
          bun run bench --json=bench.json | tee bench-output.txt
      # Second pass: the gate takes the per-shape min of both runs —
      # contention only inflates, so the min is the honest capability.
      - name: Benchmark (second pass for the gate)
        if: github.event_name == 'pull_request'
        run: bun run bench --json=bench2.json > /dev/null
      # Perf gate (Q1): fail the PR when the calibrated per-shape cost
      # (min of 2 PR runs) regresses more than 20% against the median of
      # the 5-run main-branch history (maintained on gh-pages by the
      # bench-baseline job on main pushes). Read-only. PRs only:
      # comparing two different main runners is machine noise
      # (observed ±30-47% across regions on identical code), not signal.
      - name: Perf gate (20% regression threshold)
        if: github.event_name == 'pull_request'
        run: bun run scripts/perf-gate.ts --check
      - name: Upload bench artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-${{ github.sha }}
          path: bench-output.txt

  # Main pushes store the new perf baseline (needs contents: write,
  # so it lives in its own main-only job; PR runs stay read-only).
  bench-baseline:
    if: github.ref == 'refs/heads/main'
    needs: [test] # baseline only refreshes after a green suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match the test job.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run bench --json=bench.json > /dev/null
      - name: Store perf baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/perf-gate.ts --update
