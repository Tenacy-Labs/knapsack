name: Publish

# P2 (docs/future-work.md): publishing leaves the machine — this runs
# only on an explicit version tag, which is the owner-approval gesture.
# GitHub Packages under the @tenacy-labs scope is the first stop.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match ci.yml: paper §7.2 measurements and the
          # bench baselines are taken on this version.
          bun-version: 1.3.14
      # Same gates as CI: frozen lockfile, types, tests.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # setup-node writes the .npmrc that maps NODE_AUTH_TOKEN to the
      # GitHub Packages registry; publishConfig.registry targets it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
