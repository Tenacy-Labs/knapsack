name: Release

# Release Please (future-work P2): conventional commits on main keep a
# running release PR open; merging it is the owner-approval gesture.
# On merge, release-please bumps the version, updates the changelog,
# cuts the v* tag + GitHub Release, and THIS run publishes — a
# token-created tag would not trigger a separate publish workflow.
# Manual v* tag pushes still publish directly (fallback path).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: >-
      always() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match ci.yml: paper §7.2 measurements and the
          # bench baselines are taken on this version.
          bun-version: 1.3.14
      # Same gates as CI: frozen lockfile, types, tests.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # setup-node writes the .npmrc that maps NODE_AUTH_TOKEN to the
      # GitHub Packages registry; publishConfig.registry targets it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
