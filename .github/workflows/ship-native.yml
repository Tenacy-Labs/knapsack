name: Ship Native

# Prebuilt native kernel pipeline (review round 4, M5): the binaries
# under native/prebuilt/ are distributables the npm package ships to
# every consumer; this workflow is their only sanctioned build path.
# Every run:
#   - detects whether native/ (or this workflow) changed; builds only
#     when it did — but the `verify` job reports on EVERY PR (sentinel
#     success when nothing native changed), so "Ship Native / verify"
#     is safe to list as a branch-protection required check;
#   - builds all five (platform, arch) triples on native runners with a
#     pinned rustc (PROVENANCE.md's toolchain, kept identical across
#     triples), running the Rust guard tests first;
#   - on host-matching runners, runs the Bun differential (fresh dylib
#     vs the TypeScript kernel) against the JUST-BUILT artifact;
#   - gates the COMMITTED binaries: PROVENANCE's source-hash must match
#     the checked-out native/ sources (staleness) and every committed
#     binary must match its recorded sha256 (integrity) — rebuild
#     byte-identity is reported, not gated (toolchains are not
#     byte-deterministic across runner image updates);
#   - on workflow_dispatch(refresh=true), commits freshly built
#     binaries plus a regenerated PROVENANCE.md to the dispatching
#     branch (the source-change ritual: edit lib.rs -> dispatch refresh
#     -> merge the refreshed binaries in the same PR).

on:
  push:
    branches: [main]
    paths: [native/**, .github/workflows/ship-native.yml]
  pull_request:
    # No paths filter: the verify sentinel must report on every PR for
    # branch protection (a path-filtered required check leaves untouched
    # PRs stuck in "expected"). The build matrix is gated by the
    # `changes` job instead.
  workflow_dispatch:
    inputs:
      refresh:
        description: "Commit rebuilt binaries + regenerated PROVENANCE.md to the dispatching branch"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ship-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.95.0"

jobs:
  # Path detection: does this run touch native sources or this
  # workflow? PR events diff against the merge base; dispatch and push
  # default to building.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.detect.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base against the PR base
      - name: Detect native changes
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base "$BASE" HEAD)"
          if git diff --name-only "$base" HEAD -- native/ .github/workflows/ship-native.yml | grep -q .; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.triple }}
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-latest # arm64 runner, native build
            ext: .dylib
            host-test: true
          - triple: x86_64-apple-darwin
            os: macos-latest # cross from arm64 (Xcode linker handles it)
            ext: .dylib
            cross: x86_64-apple-darwin
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: .so
            host-test: true
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-latest # cross via gcc-aarch64-linux-gnu
            ext: .so
            cross: aarch64-unknown-linux-gnu
            cross-linker: aarch64-linux-gnu-gcc
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .dll
            host-test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          cargo --version
      - name: Install cross linker (${{ matrix.cross-linker }})
        if: matrix.cross-linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Rust guard tests + release build
        working-directory: native
        shell: bash
        env:
          CROSS_TARGET: ${{ matrix.cross }}
          CROSS_LINKER: ${{ matrix.cross-linker }}
        run: |
          set -euo pipefail
          cargo test --release --locked
          if [ -n "$CROSS_TARGET" ]; then
            rustup target add "$CROSS_TARGET"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="$CROSS_LINKER"
            cargo build --release --locked --target "$CROSS_TARGET"
          else
            cargo build --release --locked
          fi
      - name: Stage artifact
        shell: bash
        env:
          CROSS_TARGET: ${{ matrix.cross }}
          TRIPLE: ${{ matrix.triple }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          dir="native/target/release"
          if [ -n "$CROSS_TARGET" ]; then
            dir="native/target/$CROSS_TARGET/release"
          fi
          # Unix cdylibs carry a lib prefix; MSVC ones do not
          # (knapsack_native.dll, not libknapsack_native.dll).
          if [ -f "$dir/libknapsack_native$EXT" ]; then
            bin="$dir/libknapsack_native$EXT"
          else
            bin="$dir/knapsack_native$EXT"
          fi
          cp "$bin" "$TRIPLE$EXT"
          hash_cmd="sha256sum"; command -v sha256sum >/dev/null || hash_cmd="shasum -a 256"
          "$hash_cmd" "$TRIPLE$EXT" | tee "sha-$TRIPLE.txt"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.host-test
        with:
          bun-version: 1.3.14 # pinned: match ci.yml
      - name: Differential vs TypeScript kernel (fresh artifact)
        if: matrix.host-test
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
          EXT: ${{ matrix.ext }}
        run: |
          bun install --frozen-lockfile
          KNAPSACK_NATIVE_DYLIB="$PWD/$TRIPLE$EXT" bun test test/native.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.triple }}
          path: |
            ${{ matrix.triple }}${{ matrix.ext }}
            sha-${{ matrix.triple }}.txt
          if-no-files-found: error

  # Provenance gates for the committed distributables. This job reports
  # a conclusion on EVERY PR (sentinel success when nothing under
  # native/ changed) so it is safe as a branch-protection required
  # check; the gates themselves run only when the build matrix did.
  verify:
    needs: [changes, build]
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.refresh != true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sentinel — no native changes in this PR
        if: needs.changes.outputs.native != 'true'
        run: 'echo "verify: no native/ changes — provenance gates skipped (required-check sentinel: success)"'
      - name: Fail closed when the build matrix did not succeed
        if: needs.changes.outputs.native == 'true' && needs.build.result != 'success'
        run: |
          echo "verify: build matrix result was '${{ needs.build.result }}' — cannot verify provenance without fresh builds" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.native == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.native == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Verify committed binaries against PROVENANCE.md
        if: needs.changes.outputs.native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          ext_of() {
            if [ -f "dist/$1.dylib" ]; then echo .dylib
            elif [ -f "dist/$1.so" ]; then echo .so
            else echo .dll; fi
          }
          # Gate 1 — staleness: the recorded source-hash must match this
          # tree's native/ sources; a mismatch means lib.rs/Cargo changed
          # since the last refresh — dispatch Ship Native with
          # refresh=true and land the refreshed binaries in the same PR.
          recorded=$(grep -oP '^source-hash: \K[0-9a-f]{64}' native/prebuilt/PROVENANCE.md || true)
          computed=$(cat native/src/lib.rs native/Cargo.toml native/Cargo.lock | sha256sum | cut -d' ' -f1)
          if [ "$recorded" != "$computed" ]; then
            echo "STALE BINARIES: PROVENANCE source-hash $recorded != native/ sources $computed" >&2
            echo "Run: workflow_dispatch Ship Native with refresh=true on this branch, land the refreshed binaries in the same PR." >&2
            fail=1
          fi
          # Gate 2 — integrity: every committed distributable must match
          # the sha256 recorded in PROVENANCE.md's table. Together with
          # gate 1 this pins "the committed bytes are the ones the last
          # refresh built from exactly these sources".
          for f in dist/sha-*.txt; do
            triple=$(basename "$f" .txt); triple=${triple#sha-}
            ext=$(ext_of "$triple")
            committed=$(sha256sum "native/prebuilt/$triple$ext" | cut -d' ' -f1)
            if ! grep -q "$committed" native/prebuilt/PROVENANCE.md; then
              echo "INTEGRITY FAIL: committed $triple$ext ($committed) is not the hash PROVENANCE.md records" >&2
              fail=1
            fi
          done
          # Report (not a gate): fresh-build reproducibility. MSVC and
          # runner-image toolchain updates are not byte-deterministic
          # (observed: windows dll differs across runs of identical
          # source), so byte-identity of a REBUILD is informational;
          # source provenance above is the hard guarantee.
          for f in dist/sha-*.txt; do
            triple=$(basename "$f" .txt); triple=${triple#sha-}
            ext=$(ext_of "$triple")
            expected=$(cut -d' ' -f1 "$f")
            committed=$(sha256sum "native/prebuilt/$triple$ext" | cut -d' ' -f1)
            if [ "$expected" != "$committed" ]; then
              echo "  ~ $triple: rebuild not byte-identical (toolchain drift; sources verified above)"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "verify: committed prebuilts are stale or tampered — see above" >&2
            exit 1
          fi
          echo "verify: PROVENANCE source-hash matches native/ sources; all five committed binaries match their recorded hashes."

  # Manual ritual after native/ source changes: build everything, then
  refresh:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.refresh == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Install refreshed binaries + regenerate PROVENANCE.md
        shell: bash
        run: |
          set -euo pipefail
          ext_of() {
            if [ -f "dist/$1.dylib" ]; then echo .dylib
            elif [ -f "dist/$1.so" ]; then echo .so
            else echo .dll; fi
          }
          for f in dist/sha-*.txt; do
            triple=$(basename "$f" .txt); triple=${triple#sha-}
            cp "dist/$triple$(ext_of "$triple")" "native/prebuilt/$triple$(ext_of "$triple")"
          done
          source_hash=$(cat native/src/lib.rs native/Cargo.toml native/Cargo.lock | sha256sum | cut -d' ' -f1)
          {
            echo "# Prebuilt native dylibs — provenance"
            echo
            echo "Machine-regenerated by the \`ship-native\` workflow (workflow_dispatch"
            echo "refresh=true) — the only sanctioned build path. Do not hand-edit."
            echo
            echo "source-hash: $source_hash"
            echo
            echo "The source-hash is sha256 of native/src/lib.rs + Cargo.toml +"
            echo "Cargo.lock concatenated; the verify job recomputes it on every"
            echo "run — edit native/ sources, then dispatch a refresh so the"
            echo "binaries and this file move in the same PR."
            echo
            echo "## Current prebuilts (rustc $RUST_VERSION, built on Actions runners)"
            echo
            echo "| triple | size | sha256 | built on |"
            echo "|---|---|---|---|"
            for f in dist/sha-*.txt; do
              triple=$(basename "$f" .txt); triple=${triple#sha-}
              ext=$(ext_of "$triple")
              sha=$(cut -d' ' -f1 "$f")
              size=$(stat -c%s "dist/$triple$ext")
              os=$(case "$triple" in *apple-darwin) echo macos-latest;; *linux*) echo ubuntu-latest;; *windows*) echo windows-latest;; esac)
              echo "| $triple | $size | $sha | $os (rustc $RUST_VERSION) |"
            done
            echo
            echo "## Verification (per build)"
            echo
            echo "- Rust guard tests (raw-ABI validation: empty groups, profit-sum"
            echo "  and window overflow guards) run before every build."
            echo "- Host-matching runners run the Bun 500-problem differential"
            echo "  (value/weight/choiceIndex/cellsVisited) against the FRESH"
            echo "  artifact via KNAPSACK_NATIVE_DYLIB."
            echo "- The verify job gates on the source-hash above (staleness)"
            echo "  and on every committed binary matching its recorded"
            echo "  sha256 (integrity); rebuild byte-identity is reported."
            echo "- rc conventions: 0 ok; −1 over budget; −2 infeasible; −3 invalid"
            echo "  input; −4 contained panic (catch_unwind at the FFI edge)."
          } > native/prebuilt/PROVENANCE.md
      - name: Commit refreshed binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          git add native/prebuilt
          git commit -m "chore(native): refresh prebuilt binaries (ship-native workflow)"
          git push origin "HEAD:$branch"
